name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      enricher_revision:
        description: "Full Enricher commit whose successful integration CI pins this Worker commit"
        required: true
        type: string
      nas_drained:
        description: "NAS consumers are drained and stopped; its prior image/config is backed up"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CAIRN_RELEASE_TOKEN: ${{ secrets.CAIRN_ENRICHER_TOKEN }}
      ENRICHER_REVISION: ${{ inputs.enricher_revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check Cloudflare secrets
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CAIRN_RELEASE_TOKEN}" || { echo "::error::Missing CAIRN_ENRICHER_TOKEN for read-only checks"; exit 1; }

      - name: Require drained consumers and a verified stack pair
        env:
          GH_TOKEN: ${{ github.token }}
          NAS_DRAINED: ${{ inputs.nas_drained }}
        run: |
          set -euo pipefail
          test "$NAS_DRAINED" = true || { echo "::error::Drain and back up the NAS before deployment"; exit 1; }
          [[ "$ENRICHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Use a full Enricher commit SHA"; exit 1; }
          gh api "repos/Alpenl/cairn-x-enricher/contents/deploy/stack-contract.json?ref=$ENRICHER_REVISION" --jq .content | base64 --decode > "$RUNNER_TEMP/stack-contract.json"
          jq -e --arg sha "$GITHUB_SHA" '.worker_repository == "Alpenl/cairn-share" and .worker_revision == $sha' "$RUNNER_TEMP/stack-contract.json" >/dev/null
          gh api "repos/Alpenl/cairn-x-enricher/actions/runs?head_sha=$ENRICHER_REVISION&per_page=100" > "$RUNNER_TEMP/stack-ci.json"
          jq -e '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success")] | length > 0' "$RUNNER_TEMP/stack-ci.json" >/dev/null

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run deploy:dry-run
          node --test ../scripts/release-smoke.test.mjs ../scripts/release-record.test.mjs

      - name: Record pre-deployment versions and D1 restore point
        run: node ../scripts/release-record.mjs before "$RUNNER_TEMP/release-record"

      - name: Apply remote D1 migrations
        id: migrate
        run: npm run migrate:remote

      - name: Deploy Worker
        id: deploy
        run: |
          set -euo pipefail
          npm run deploy -- --tag "$GITHUB_SHA" | tee "${RUNNER_TEMP}/wrangler-deploy.txt"
          echo "url=https://share.alpenl.com" >> "$GITHUB_OUTPUT"

      - name: Verify deployed read contracts without model calls
        run: node ../scripts/release-smoke.mjs "$RUNNER_TEMP/release-record/readonly-verification.json"

      - name: Record resulting deployment and budget state
        if: ${{ always() && steps.migrate.outcome != 'skipped' }}
        env:
          RELEASE_DEPLOYED: ${{ steps.deploy.outcome != 'skipped' }}
        run: node ../scripts/release-record.mjs after "$RUNNER_TEMP/release-record"

      - name: Retain recovery manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cairn-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-record/
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "Worker: cairn-share-api"
            echo "Database: cairn-share"
            echo "Commit: ${GITHUB_SHA}"
            echo "Verified Enricher: ${ENRICHER_REVISION}"
            echo "Restore metadata: release artifact (D1 recovery remains an explicit operator action)"
            echo "URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
