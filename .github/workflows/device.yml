name: device

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "worker/**"
      - "tests/android-worker/**"
      - ".github/workflows/device.yml"

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install local Worker dependencies
        run: npm ci --prefix worker

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            ./android/gradlew -p android --no-daemon --dependency-verification strict connectedDebugAndroidTest
            ANDROID_SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ {print $1}')" bash tests/android-worker/run.sh

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: connected-test-report-api-${{ matrix.api-level }}
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/cairn-android-worker.*/*.log
            ${{ runner.temp }}/cairn-android-worker.*/transport-history.json
          if-no-files-found: ignore
          retention-days: 7
