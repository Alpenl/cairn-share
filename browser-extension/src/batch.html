<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cairn · 批量补采正文</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="batch.css"></head>
<body class="options batch">
<div class="set-shell">
  <header class="set-top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="18.6" rx="7.6" ry="2.7"/><ellipse cx="11.5" cy="12.7" rx="5.4" ry="2.5"/><ellipse cx="12.3" cy="7.4" rx="3.4" ry="2.1"/></svg></span><span class="brand-name">Cairn</span><span class="brand-sub">批量补采正文</span></div>
    <a class="text-button" href="options.html">← 返回设置</a>
  </header>
  <main class="set-main">
    <div class="set-title">
      <h1>批量补采正文</h1>
      <p>为收藏库里缺少正文的链接逐篇打开页面、采集正文和媒体，然后关闭采集页。已有正文的收藏会自动跳过。</p>
    </div>
    <section class="card batch-controls" aria-label="采集进度">
      <div class="section-heading"><h2 id="phase">准备就绪</h2><span id="count" class="muted"></span></div>
      <progress id="progress" max="1" value="0" aria-label="本轮采集进度"></progress>
      <p id="detail" class="muted" aria-live="polite">点击开始，扫描所有缺少正文的收藏。</p>
      <div class="batch-actions"><button id="start" class="primary" type="button">一键采集所有待办</button><button id="resume" class="primary" type="button" hidden>继续采集</button><button id="pause" class="secondary" type="button" hidden>暂停采集</button><button id="retry-failed" class="secondary" type="button" hidden>重试失败项</button></div>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <p class="hint">使用当前浏览器的登录状态，首次使用需要允许访问网站。关闭此页面后仍会继续；暂停只停止打开新页面，已采集的内容继续上传；重启浏览器后需手动继续。</p>
    </section>
    <section class="set-group" aria-labelledby="g-tasks">
      <div class="set-head"><h2 id="g-tasks">本轮任务</h2><span id="totals" class="count"></span></div>
      <div class="set-card"><div id="tasks" class="batch-list"><div class="batch-empty"><div class="ttl">尚未开始</div><div class="dsc">点击「一键采集所有待办」扫描所有缺少正文的收藏。</div></div></div></div>
      <button id="more" type="button" class="text-button" hidden>显示更多任务</button>
    </section>
    <section class="set-group" aria-labelledby="g-pending">
      <div class="set-head"><h2 id="g-pending">待同步</h2><span id="pending-count" class="count">0</span><button id="retry-all" class="text-button" type="button" hidden>全部重试</button></div>
      <p class="muted">「已采集」表示内容已保存在本机。正文、图片与视频的上传进度在这里显示。</p>
      <div class="set-card"><div id="queue" class="set-queue"></div></div>
    </section>
  </main>
</div>
<script type="module" src="batch-ui.mjs"></script>
</body></html>
