<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>收藏到 Cairn</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <header class="pp-head">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="18.6" rx="7.6" ry="2.7"/><ellipse cx="11.5" cy="12.7" rx="5.4" ry="2.5"/><ellipse cx="12.3" cy="7.4" rx="3.4" ry="2.1"/></svg></span><span class="brand-name">Cairn</span></div>
    <span id="sync-pill" class="sync-pill" hidden><i></i><span id="sync-text"></span></span>
    <button id="settings" class="icon-button" type="button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2-1.2L14.5 3h-4l-.4 2.6a7.6 7.6 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg></button>
  </header>
  <main>
    <section id="setup" class="setup" hidden><h1>连接你的收藏库</h1><p>填写 Cairn App「设置 → 访问令牌」中的令牌后，就能一键收藏网页。</p><button id="open-settings" class="primary" type="button">去设置</button></section>
    <form id="capture-form">
      <div id="page-card" class="page-card">
        <div class="pc-top"><img id="favicon" alt="" width="16" height="16" hidden><span id="page-host" class="page-host"></span><span id="saved-badge" class="saved-badge" hidden>已收藏</span><button id="edit-url" class="text-button" type="button">改链接</button></div>
        <p id="page-title" class="page-title"></p>
        <div id="url-field" class="url-field" hidden><textarea id="url" class="url-input" rows="2" maxlength="8192" spellcheck="false" required placeholder="粘贴要收藏的链接" aria-label="链接"></textarea></div>
        <p id="saved-note" class="saved-note" hidden></p>
        <div id="capture-option" class="cap-row" hidden>
          <div id="cap-stats" class="cap-stats" aria-live="polite"></div>
          <label class="switch" title="同时保存正文、图片和视频"><input id="capture-page" type="checkbox" checked><span class="track"></span><span>保存正文和媒体</span></label>
        </div>
      </div>
      <p id="url-policy" class="hint policy" hidden></p>
      <div id="collections" hidden>
        <div class="ps-head"><span>合集</span><span id="collections-aux" class="aux">可多选</span></div>
        <div id="collection-choices" class="collection-choices"></div>
        <p class="coll-foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>新合集请在网页工作区或 App 中创建。</span></p>
      </div>
      <div>
        <div class="ps-head"><label for="note">收藏原因</label><span class="aux">可选</span></div>
        <div class="reason"><textarea id="note" rows="2" maxlength="2000" placeholder="写一句为什么收藏…"></textarea><div class="reason-foot"><span class="kbd">Ctrl</span><span class="kbd">↵</span><span>保存</span><span id="note-count" class="character-count">0 / 2000</span></div></div>
      </div>
    </form>
    <section id="queue-section" class="queue-section" hidden>
      <div class="section-heading"><h2>待同步 <span id="pending-count">0</span></h2><button id="retry-all" type="button" class="text-button" hidden>全部重试</button></div>
      <div id="queue"></div>
      <button id="image-permission" class="text-button" type="button" hidden>允许读取媒体站点</button>
    </section>
    <a class="batch-entry" href="batch.html" target="_blank" rel="noopener">批量补采收藏库正文 →</a>
  </main>
  <div id="save-dock" class="save-dock"><p id="status" class="status" role="status" aria-live="polite" hidden></p><button id="save" form="capture-form" class="primary" type="submit" title="Ctrl / ⌘ + Enter" disabled><span id="save-label">保存</span><span class="kbd" data-k="Ctrl ↵" aria-hidden="true"></span></button><button id="recapture" class="text-button recapture" type="button" hidden>重新采集并更新原收藏</button></div>
  <script type="module" src="popup.mjs"></script>
</body></html>
