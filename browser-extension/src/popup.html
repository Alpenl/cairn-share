<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>收藏到 Cairn</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <header class="app-header"><div class="brand"><img src="icons/48.png" alt="" width="28" height="28"><span>Cairn</span></div><button id="settings" class="text-button" type="button">设置</button></header>
  <main>
    <h1>留住这一页</h1>
    <p id="connection" class="muted"></p>
    <form id="capture-form">
      <label for="url">链接</label><textarea id="url" class="url-input" rows="2" maxlength="8192" spellcheck="false" required placeholder="https://…"></textarea>
      <p id="page-title" class="page-title"></p><p id="url-policy" class="muted"></p>
      <label for="note">备注 <span class="optional">可选</span></label><textarea id="note" rows="2" maxlength="2000" placeholder="为什么想留下它？"></textarea><div id="note-count" class="character-count">0 / 2000</div>
      <label class="check capture-check"><input id="capture-page" type="checkbox" checked><span>同时保存正文、图片、视频和音频</span></label>
      <p id="capture-hint" class="muted"></p>
      <button id="image-permission" class="text-button" type="button">允许读取媒体站点</button>
    </form>

    <section class="queue-section"><div class="section-heading"><h2>待上传 <span id="pending-count">0</span></h2><button id="retry-all" type="button" class="text-button" hidden>全部重试</button></div><div id="queue"></div></section>
  </main><div class="save-dock"><p id="status" class="status" role="status" aria-live="polite" hidden></p><button id="save" form="capture-form" class="primary" type="submit" disabled>保存收藏</button><button id="recapture" class="text-button" type="button" hidden>重新采集并更新原收藏</button><span class="muted shortcut">⌘ / Ctrl + Enter 保存</span></div><footer>与 Android 收藏同步 · <span id="server"></span></footer>
  <script type="module" src="popup.mjs"></script>
</body></html>
